name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test（Paper 1.21.4 / JDK 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PepperLib 自己的构建要求 JDK 25 工具链（buildSrc 里的 pepper.java-conventions）。
      # 先装一个 25 备用，但不让它成为 JAVA_HOME（紧接着的 JDK 21 会覆盖），
      # 只在发布那一步把路径交给 Gradle 的工具链探测——runner 上没有 foojay，
      # 不显式给路径的话 PepperLib 会直接以 "Toolchain auto-provisioning is not enabled" 失败。
      - name: Set up JDK 25 (PepperLib toolchain)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # PepperLib 是 compileOnly / testImplementation 的前置库（坐标 ltd.pepper:pepper-lib:<pepperLibVersion>），
      # 只发布在开发机的 mavenLocal，公共 Maven 上没有。这里按 gradle.properties 声明的版本，回放到该版本
      # 最后一次出现的 PepperLib 源码提交，发布进 runner 的 mavenLocal：
      #   - `verifyPepperLibVersion` 要求「声明版本 == 解析版本」，所以必须发布成声明的那个版本；
      #   - 换版本时同步改下面的 ref，用
      #     `git log -S'version = "x.y.z"' -- build.gradle.kts gradle.properties` 找对应提交。
      - name: Checkout PepperLib 0.15.0
        uses: actions/checkout@v4
        with:
          repository: nullpepper/PepperLib
          ref: 26f823016a4418b0553a41440a0f61c195b7783d
          path: .ci/PepperLib

      - name: Check the JDK 25 toolchain path
        shell: bash
        # 下面那条 -P 是承重的：runner 上既没有 foojay 自动下载，Gradle 也不扫 PATH 与 JAVA_HOME_25_X64，
        # 一旦这个 output 拿不到就会在发布 PepperLib 时硬失败。这里提前把原因说清楚。
        run: |
          test -n "${{ steps.jdk25.outputs.path }}" || { echo "::error::setup-java 没有给出 JDK 25 的路径"; exit 1; }
          test -x "${{ steps.jdk25.outputs.path }}/bin/java" || { echo "::error::JDK 25 路径下没有 java"; exit 1; }

      - name: Publish PepperLib to mavenLocal
        working-directory: .ci/PepperLib
        run: >-
          ./gradlew publishToMavenLocal -x test --no-daemon
          -Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }}
          -Porg.gradle.java.installations.auto-download=false

      # build → check（test + verifyPepperLibVersion）+ shadowJar，与本地发布前的验证一致。
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PepperMinecart-all
          path: build/libs/PepperMinecart-*-all.jar
          if-no-files-found: error
