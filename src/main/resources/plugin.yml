name: PepperMinecart
version: '${version}'
main: ltd.pepper.pepperminecart.PepperMinecartPlugin
api-version: '1.21'
folia-supported: false
description: 移动工作站与移动仓库 —— 把方块放到矿车上
authors: [PepperMinecart]
# 前置插件模式：PepperLib.jar 提供配置绑定/运行时存储，须先于本插件加载（单实例，绝不 shade）
depend: [PepperLib]
# 软依赖：PepperClaim 提供领地保护判定（ClaimApi）。未安装时按配置降级（默认 BOTH → 退化为伪事件策略），
# 绝不因缺失而拒绝启用。类加载期由 softdepend 决定可见性（compileOnly 只提供编译期签名）。
softdepend: [PepperClaim]

commands:
  pepperminecart:
    description: PepperMinecart 主命令
    usage: /<command> reload
    aliases: [pm]

permissions:
  pepperminecart.use:
    description: 允许放置/取下矿车方块并打开矿车界面
    default: true
  pepperminecart.reload:
    description: 允许执行 /pm reload 热重载配置
    default: op
